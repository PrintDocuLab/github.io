<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="0 0 825 218" height="218pt" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="825pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
 <style>
    #napis &gt; path {
        opacity: 0;
        animation-duration: 4.0s;
        animation-timing-function: ease-out;
        animation-iteration-count: infinite;
        animation-delay: 0s;
    }

    /* PRINT (niebieskie) */
    @keyframes l1  { 0%       { opacity: 0; } 8.75%, 88%  { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l2  { 0%, 4%   { opacity: 0; } 12.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l3  { 0%, 8%   { opacity: 0; } 16.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l4  { 0%, 12%  { opacity: 0; } 20.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l5  { 0%, 16%  { opacity: 0; } 24.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }

    /* DOCU (różowe) */
    @keyframes l6  { 0%, 20%  { opacity: 0; } 28.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l7  { 0%, 24%  { opacity: 0; } 32.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l8  { 0%, 28%  { opacity: 0; } 36.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l9  { 0%, 32%  { opacity: 0; } 40.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }

    /* LAB (żółte) */
    @keyframes l10 { 0%, 36%  { opacity: 0; } 44.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l11 { 0%, 40%  { opacity: 0; } 48.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }
    @keyframes l12 { 0%, 44%  { opacity: 0; } 52.75%, 88% { opacity: 1; } 88.01%, 100% { opacity: 0; } }

    #napis &gt; path:nth-of-type(1)  { animation-name: l1; }
    #napis &gt; path:nth-of-type(2)  { animation-name: l2; }
    #napis &gt; path:nth-of-type(3)  { animation-name: l3; }
    #napis &gt; path:nth-of-type(4)  { animation-name: l4; }
    #napis &gt; path:nth-of-type(5)  { animation-name: l5; }
    #napis &gt; path:nth-of-type(6)  { animation-name: l6; }
    #napis &gt; path:nth-of-type(7)  { animation-name: l7; }
    #napis &gt; path:nth-of-type(8)  { animation-name: l8; }
    #napis &gt; path:nth-of-type(9)  { animation-name: l9; }
    #napis &gt; path:nth-of-type(10) { animation-name: l10; }
    #napis &gt; path:nth-of-type(11) { animation-name: l11; }
    #napis &gt; path:nth-of-type(12) { animation-name: l12; }
	
	    /* Animacja błysku dla dużych liter P, D, L w warstwie Tlo */
    @keyframes pdlShine {
        0%, 55% {
            filter: brightness(0.9);
        }
        68% {
            filter: brightness(1.1) drop-shadow(0 0 6px rgba(224, 176, 83, 0.7));
        }
        82%, 100% {
            filter: brightness(0.9);
        }
    }

    /* Celujemy w 2., 3. i 4. element w warstwie Tlo (duże litery P, D, L) */
    #Tlo &gt; path:nth-of-type(2),
    #Tlo &gt; path:nth-of-type(3),
    #Tlo &gt; path:nth-of-type(4) {
        animation: pdlShine 4.0s ease-in-out infinite;
    }

</style>

